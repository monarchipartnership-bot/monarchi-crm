<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>opwizard test (temporary)</title></head>
<body style="margin:0;background:#17051c"><div id="root"></div>
<script type="module">
import '/src/index.css'; import '/src/styles/hubPalette.css'; import '/src/styles/constellationTest.css'; import '/src/styles/campaignsSection.css';
const q = new URLSearchParams(location.search).get('s') || '1';
const steps = ['Клієнт і режим', 'Налаштування агентів', 'Підсумок'], cur = +q;
const line = steps.map((s, i) => (i ? `<li class="cpw-ln${cur >= i + 1 ? ' is-done' : ''}"></li>` : '') + `<li class="cpw-st${cur === i + 1 ? ' is-current' : cur > i + 1 ? ' is-done' : ''}"><i>${cur > i + 1 ? '✓' : i + 1}</i>${s}</li>`).join('');
const mode = (t, s, on) => `<button class="cmp-moderow${on ? ' is-on' : ''}"><span class="cmp-modeicon cmp-modeicon--sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></span><span><b>${t}</b><small>${s}</small></span><span class="cmp-radio"></span></button>`;
const step1 = `<div class="cmp-step1 has-client"><section class="cmp-chosen"><div><span class="cmp-kicker">1. Клієнт</span><b>Mellow Diamond</b><span class="cmp-client-badges"><em style="--c:#4C7DFF">Meta</em><em style="--c:#F2A93B">Google</em></span></div><button class="cmp-btn">Змінити клієнта</button></section>
<section class="cmp-schemebox is-open"><div class="cmp-modes"><h3>2. Що створюємо для «Mellow Diamond»?</h3><p class="cmp-muted">Це визначає, що саме запуститься.</p><div class="cmp-modepick"><div class="cmp-modelist">${mode('Тільки креативи', 'без витрат', false)}${mode('Аналітика', 'без запуску', false)}${mode('Повний запуск', 'усі агенти', true)}</div><div class="cmp-modepanel"><div class="cmp-modecard-top"><span class="cmp-modeicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></span><span><b>Повний запуск</b><small>усі агенти</small></span></div><p class="cmp-modecard-text">Усі агенти операції працюють за розкладом.</p><span class="cmp-modechips"><span class="cmp-modechip is-warn"><i></i>Старт: одразу</span></span></div></div></div>
<div class="cmp-platforms"><h3>3. Які канали ведемо?</h3><div class="cmp-chips"><button class="cmp-chip is-on" style="--c:#4C7DFF"><i></i>Meta Ads</button><button class="cmp-chip is-on" style="--c:#F2A93B"><i></i>Google Ads</button><button class="cmp-chip" style="--c:#18C7C0"><i></i>TikTok Ads<small>дані вручну</small></button></div></div>
<div class="cmp-dept"><div class="cmp-dept-head"><h3>Додатково: Відділ креативів</h3><label class="cmp-switch"><input type="checkbox" checked><span>Підключено</span></label></div><ul class="cmp-dept-chain"><li class="is-req"><b>Креативний стратег</b><small>система гіпотез</small><em>обовʼязковий</em></li><li class="is-opt"><b>Виробник креативів</b><small>запуск у Higgsfield</small><label><input type="checkbox" checked> бере участь</label></li></ul></div></section></div>`;
const nav = [['Загальне про операцію', '·', '#c76dff', ''], ['Аналітик Meta Ads', 1, '#4C7DFF', 'is-seen'], ['Аналітик Google Ads', 2, '#F2A93B', 'is-current'], ['Оптимізатор Meta Ads', 3, '#4C7DFF', ''], ['Оптимізатор Google Ads', 4, '#F2A93B', 'is-off']].map(([n, i, c, k]) => `<li><button class="${k}" style="--c:${c}"><i class="cow-n">${i}</i><span>${n}</span>${k === 'is-off' ? '<small>вимкнено</small>' : ''}</button></li>`).join('');
const step2 = `<div class="cmp-step2"><nav class="cmp-agentnav"><ol>${nav}</ol></nav><section class="cmp-agentform"><div class="cmp-agent-head"><div><span class="cmp-kicker">Аналіз каналів · агент 2 з 6</span><h3>Аналітик Google Ads</h3></div><label class="cmp-switch"><input type="checkbox" checked><span>Бере участь</span></label></div><p class="cmp-muted">Щотижня читає кабінет Google Ads.</p><div class="cmp-field"><label>KPI і цілі</label><textarea class="cmp-input" rows="3">Знизити CPL до $15</textarea></div></section></div>`;
const step3 = `<div class="cmp-step3"><section class="cmp-summary"><h3>Підсумок перед запуском</h3><p class="cmp-strip cmp-strip--warn"><b>Агенти стартують одразу</b> після «Запустити».</p><dl><div><dt>Клієнт</dt><dd>Mellow Diamond</dd></div><div><dt>Режим</dt><dd>Повний запуск</dd></div><div><dt>Канали</dt><dd>Meta Ads, Google Ads</dd></div></dl><div class="cmp-flow"><b>Що буде після запуску</b><ol><li>Аналітики читають кабінети.</li></ol></div><ul class="cmp-agentlist"><li><b>Аналіз каналів</b><ul><li><span>Аналітик Meta Ads</span><small>щопонеділка</small></li></ul></li></ul></section></div>`;
document.getElementById('root').innerHTML = `<div class="cmp-overlay ai-immersive" style="animation:none"><div class="cmp-wizard cpw cow" style="max-height:92dvh"><header class="cmp-wiz-head"><div><span class="cmp-kicker">Нова операція</span><h2>Створити команду агентів для клієнта</h2></div><button class="cmp-x">✕</button></header><ol class="cpw-line">${line}</ol><div class="cmp-wiz-body">${[step1, step2, step3][cur - 1]}</div><footer class="cmp-wiz-foot"><button class="cmp-btn">Назад</button><span class="cmp-foot-note">Агент 2 з 6</span><button class="cmp-btn cmp-btn--primary">Далі</button></footer></div></div>`;
</script></body></html>

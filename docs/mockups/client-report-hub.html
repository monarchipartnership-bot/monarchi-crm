<title>Страница отчёта клиента в Hub style</title>

<style>
/* Layout: the project card (/projects/:id) in Hub style. A header, the approved centered list of six sections, and one pane per section. Two switches at the top let you compare the header and the table style. Approved Hub parts are reused as they are; new ones (tables, delta pills, toggles, option cards, notices, timeline, report windows) are drafted here. Sample numbers are illustrative. */
:root{--plum:#682768;--acc:#AE40AE;--line:#EBC6EB;--bg:#F9EDF9;--ink:#270827;--mut:#883288;--page:#F6F1F8;--soft:#F3E3F7;--grad:linear-gradient(100deg,#B544B5,#661466);--ok:#168a3a;--okb:#E3F6E8;--wa:#946200;--wab:#FBF0D5;--bad:#C23232;--badb:#FBEAEA;--ease:cubic-bezier(.3,.7,.2,1);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:800;line-height:1.15}
.lead{color:#6b4a73;margin:0 0 12px;max-width:900px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 0 10px;background:var(--page)}
.bar>span{color:var(--mut);font-size:12.5px;font-weight:600}
.sw2{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--soft)}
.sw2 button{height:28px;padding:0 13px;border-radius:999px;font:600 12.5px 'Onest',sans-serif;color:#7a5a85}
.sw2 button.on{background:#fff;color:var(--plum);font-weight:700;box-shadow:inset 0 0 0 1.5px #D9A6DF,0 3px 8px #6827681f}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;text-align:left}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.ic{display:block;width:100%;height:100%;background-position:center;background-repeat:no-repeat;background-size:contain}

svg.l{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* medallion */
.md{--s:44px;--r:3.5px;--p:100;--c1:#B544B5;--c2:#661466;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c1),var(--c2) calc(var(--p)*1%),#EBD0F2 0)}
.md::before{content:"";position:absolute;inset:var(--r);border-radius:50%;background:#fff}
.md.sm{--s:34px;--r:3px}.md.xs{--s:28px;--r:2.5px}.md.lg{--s:60px;--r:5px}.md.xl{--s:76px;--r:6px}
.md .mi{position:relative;width:calc(var(--s) - var(--r)*2 - 6px);height:calc(var(--s) - var(--r)*2 - 6px);border-radius:50%;background:linear-gradient(150deg,#F6E8F9,#EBD0F2);display:grid;place-items:center;color:var(--plum)}
.md .mi .ic{width:74%;height:74%}
.md .mi.ln{background:linear-gradient(135deg,#C25AC4,#7E2483)}.md .mi.ln svg{width:50%;height:50%;stroke:#fff;stroke-width:2.2}
.st-active{--c1:#B544B5;--c2:#661466}.st-paused{--c1:#FBBF24;--c2:#E08A06}.st-completed{--c1:#C9A8D1;--c2:#8E6A99}.st-ok{--c1:#4BE07F;--c2:#12A144}.st-bad{--c1:#FF7A7A;--c2:#D92D2D}.st-mu{--c1:#C9A8D1;--c2:#8E6A99}
/* ring frame box */
.rf{--b1:#EBC6EB;--b2:#B544B5;border:2px solid transparent;border-radius:24px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b1)) border-box;box-shadow:0 4px 14px #68276810;padding:14px 16px;min-width:0}
.rf.paused{--b1:#FDE6A8;--b2:#E08A06}.rf.completed{--b1:#E6D7EA;--b2:#A98BB3}.rf.flat{border-radius:20px;padding:12px 14px;box-shadow:none}
.rf+.rf,.stack>*+*{margin-top:14px}
.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bh h3{margin:0;font-size:16px;font-weight:750;line-height:1.2}.bh small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.bh .sp{flex:1}
.hr{height:1px;background:#EBC6EB80;margin:12px 0}
.sub{font-size:12.5px;color:var(--mut)}
.note{font-size:12.5px;color:#6b4a73}

/* buttons */
.hb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 22px;border-radius:999px;font:700 14px/1 'Onest',sans-serif;white-space:nowrap;color:#fff;text-shadow:0 1px 1px #00000026;background:var(--bg2);box-shadow:var(--sh),inset 0 0 0 2px #ffffff40,0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.hb svg{width:16px;height:16px;stroke-width:2.2}
.hb.pri{--bg2:linear-gradient(100deg,#B544B5,#661466);--sh:0 5px 12px #66146644;--c:#AE40AE}
.hb.ok{--bg2:linear-gradient(135deg,#4BE07F,#12A144);--sh:0 5px 12px -2px #12A14488;--c:#4BE07F}
.hb.bad{--bg2:linear-gradient(135deg,#FF7A7A,#D92D2D);--sh:0 5px 12px -2px #D92D2D88;--c:#FF7A7A}
.hb.sec{background:#fff;color:var(--plum);text-shadow:none;box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 4px #AE40AE14}
.hb.on{background:#F1DCF5;box-shadow:inset 0 0 0 1.5px #D9A6DF,0 0 0 4px #AE40AE14}
.hb.sm{height:32px;padding:0 16px;font-size:13px}
.hb.ghost{background:none;color:var(--plum);text-shadow:none;box-shadow:none;padding:0 12px}
.hb.dang{background:none;color:var(--bad);text-shadow:none;box-shadow:none;padding:0 12px 0 6px}
.hb.dang .t{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--badb)}.hb.dang .t svg{width:12px;height:12px}
.hb.dis{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* fields */
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.f>b{display:block;font:600 12px 'Onest',sans-serif;color:var(--mut);margin:0 0 6px 6px}
.in{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 4px #AE40AE14;font:500 13.5px 'Onest',sans-serif;color:var(--plum);min-width:0}
.in.ph{color:#a77fb0}.in.foc{box-shadow:inset 0 0 0 1.5px #B544B5,0 0 0 4px #AE40AE33}
.in .cv{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--plum);margin-left:auto;flex:none}.in .cv svg{width:11px;height:11px;stroke-width:2.4}
.in.lt{padding-left:6px}.in .lt{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--plum);flex:none}.in .lt svg{width:12px;height:12px}
.in svg.lp{width:16px;height:16px;stroke:#883288;stroke-width:2.2}
.in input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;color:var(--ink);padding:0}
.in input::placeholder{color:#a77fb0}.in:focus-within{box-shadow:inset 0 0 0 1.5px #B544B5,0 0 0 4px #AE40AE33}
.tx{width:100%;min-height:88px;padding:12px 16px;border:0;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 4px #AE40AE14;font:500 13.5px/1.5 'Onest',sans-serif;color:var(--ink);resize:vertical;outline:none}
.tx::placeholder{color:#a77fb0}.tx:focus{box-shadow:inset 0 0 0 1.5px #B544B5,0 0 0 4px #AE40AE33}

/* lists: primary (medallions, approved) and secondary (segmented ribbon, approved) */
.pl-list{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:18px 0 18px}
.pt{display:flex;align-items:center;gap:11px;padding:5px 20px 5px 5px;border-radius:999px;transition:background .3s,box-shadow .3s,color .3s}
.pt b{font:700 17.5px/1.2 'Onest',sans-serif;white-space:nowrap}
.pt .md{--s:60px;--r:5px;--p:100}
.pt .md .mi{width:45px;height:45px}.pt .md .mi .ic{width:35px;height:35px}
.pt.on{background:var(--grad);color:#fff;box-shadow:0 0 0 5px #AE40AE26,0 15px 28px -10px #66146699}.pt.on .md{background:conic-gradient(#fff,#fff)}
.pl-list.six .pt{gap:9px;padding:4px 16px 4px 4px}
.pl-list.six .pt b{font-size:14.5px}
.pl-list.six .pt .md{--s:48px;--r:4px}
.pl-list.six .pt .md .mi{width:36px;height:36px}.pl-list.six .pt .md .mi .ic{width:28px;height:28px}
.sg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:#F3E3F7;max-width:100%}
.sg button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:999px;font:600 13px 'Onest',sans-serif;color:#7a5a85;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}
.sg button svg{width:14px;height:14px;stroke-width:2}.sg button .ic{width:18px;height:18px}
.sg button .n{margin-left:1px;padding-left:8px;border-left:1.5px solid #D9A6DF99;font-weight:700;font-variant-numeric:tabular-nums}
.sg button.on{background:#fff;color:var(--plum);font-weight:700;box-shadow:inset 0 0 0 1.5px #D9A6DF,0 3px 8px #6827681f}

/* status pills and chips */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 11px 'Onest',sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.pill.active,.pill.ok{background:var(--okb);color:var(--ok)}.pill.paused,.pill.wa{background:var(--wab);color:var(--wa)}.pill.completed,.pill.mu{background:#EFE6F3;color:#7a5a85}.pill.bad{background:var(--badb);color:var(--bad)}.pill.in2{background:#E8F0FE;color:#1D4FB3}
.pill.nc{text-transform:none;letter-spacing:0;font-size:12px}
.lg{display:inline-flex;align-items:center;gap:7px;padding:3px 12px 3px 4px;border-radius:999px;background:#F9EDF9;color:var(--plum);font:500 13px 'Onest',sans-serif}.lg .ic{width:22px;height:22px}
.ch{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font:600 13px 'Onest',sans-serif;color:var(--plum);white-space:nowrap}
.ch.on{background:#F1DCF5;box-shadow:inset 0 0 0 1.5px #D9A6DF;font-weight:700}.ch.dis{opacity:.6}
.ch svg{width:13px;height:13px}
.chs{display:flex;flex-wrap:wrap;gap:8px}

/* header */
.hd{margin-bottom:0}
.hd1 .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd1 .ttl{flex:1;min-width:240px}
.hd1 .nm{display:flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;font:800 22px 'Onest',sans-serif;box-shadow:inset 0 0 0 1.5px transparent;background:transparent;color:var(--ink)}
.hd1 .chs{margin-top:8px}
.hd2{position:relative;overflow:hidden;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#EBC6EB,#B544B5 55%,#EBC6EB) border-box}
.hd2::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 200px at 100% 0%,#F6E8F9 0,#fff0 70%);pointer-events:none}
.hd2>*{position:relative}
.hd2 .top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hd2 .nm{font:800 28px/1.15 'Onest',sans-serif}
.hd2 .facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hd2 .fct{display:flex;flex-direction:column;padding:8px 14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}.hd2 .fct small{font-size:11px;color:var(--mut)}.hd2 .fct b{font-size:14px}
.agent-chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 6px;border-radius:999px;background:var(--okb);color:var(--ok);font:600 13px 'Onest',sans-serif}
.agent-chip i{display:block;width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent);margin-left:4px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.tile .md{--s:36px;--r:3px}
.tile small{display:block;font-size:11.5px;color:var(--mut);line-height:1.2}.tile b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.fcts{display:flex;gap:10px;flex-wrap:wrap}
.fcts>div{padding:7px 14px;border-radius:18px;background:#F9EDF9;font-size:12px;color:var(--mut)}.fcts b{display:block;font-size:13.5px;color:var(--ink)}

.rp.on{background:#F1DCF5;box-shadow:inset 0 0 0 1.5px #D9A6DF}
.rose{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.rose{grid-template-columns:minmax(0,1fr)}}
.wlist{display:grid;gap:5px}
.wr{display:grid;grid-template-columns:54px 1fr 1fr auto;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:12.5px;text-align:left}
.wr .wd{font-weight:700}.wr .wv{font-weight:800;color:#7E2483}.wr .ws{font-weight:700;color:#2F6FED}
.wr.on{background:#F1DCF5;box-shadow:inset 0 0 0 1.5px #D9A6DF}
/* status / platform */
.stw{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}.stw.col{flex-direction:column;align-items:stretch;gap:12px}
.stw .gs.donut{width:190px;flex:none}.stw .gs.gauge{max-width:260px;margin:0 auto}
.sl{display:grid;gap:6px;flex:1;min-width:150px}
.slr{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 8px;border-radius:999px;background:#F9EDF9;font-size:13px}.slr i{width:14px;height:14px;border-radius:50%;flex:none}.slr span{flex:1;font-weight:600}.slr b{font-weight:800}.slr em{font:700 11.5px 'Onest',sans-serif;font-style:normal;color:var(--mut);min-width:34px;text-align:right}
.capsplit{display:flex;gap:5px;height:48px}.capsplit>div{display:grid;place-items:center;border-radius:999px;min-width:48px;box-shadow:inset 0 0 0 2px #ffffff40,0 6px 12px -6px #27082755}.capsplit b{font:800 17px 'Onest',sans-serif;color:#fff;text-shadow:0 1px 1px #00000030}
.plw{display:flex;align-items:center;gap:30px;flex-wrap:wrap;justify-content:center}
.plw .gs{width:230px;flex:none}.plw .gs.bubs{width:330px}.plw .gs.big{width:230px}
.pl{display:grid;gap:7px;flex:1;min-width:260px;max-width:420px}
.plr{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.plr .md{--s:34px;--r:3px}
.plr .pn{flex:1;font-weight:600;font-size:13.5px}.plr b{font-weight:800;font-variant-numeric:tabular-nums}
.plr.tot{background:#F9EDF9;box-shadow:none;padding-left:16px;font-weight:800}
.intro{color:#6b4a73;margin:0 0 6px;max-width:980px}

/* ===== Reports Manager additions ===== */
.pl-list.sw5{margin:6px 0 16px}
.pl-list.sw5 .pt .md{--s:48px;--r:4px}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#F3E3F7;color:var(--plum);flex:none}.ib svg{width:14px;height:14px;stroke-width:2.3}.ib.bd{background:#FBEAEA;color:#C23232}.ib.sm0{width:22px;height:22px;margin-left:4px}.ib.sm0 svg{width:11px;height:11px}
.tbr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}.tbl2{display:flex;gap:12px;flex-wrap:wrap}.tbr2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:auto}
.svs{display:inline-flex;align-items:center;gap:8px;font:600 12.5px 'Onest',sans-serif;color:#6b4a73}.svs i{width:10px;height:10px;border-radius:50%;background:#12A144;box-shadow:0 0 0 3px #12A14430}
.suf{font-style:normal;font-weight:700;color:var(--mut);font-size:12px}
.in.bigv{height:44px;padding:0 14px}.in.bigv input{font:800 20px 'Onest',sans-serif;font-variant-numeric:tabular-nums}
.in.ro{background:#F9EDF9;box-shadow:none}
.prow{align-items:end}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.kp.w7{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.kp.c5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.kp.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mc{display:flex;flex-direction:column;gap:8px;padding:12px 14px}.mc.rr{flex-direction:row;align-items:center;gap:12px}
.mch{display:flex;align-items:center;gap:10px}.mct{flex:1;min-width:0}.mct small{display:block;font-size:12px;color:var(--mut);line-height:1.2}.mct .v{display:block;font:800 21px/1.2 'Onest',sans-serif;font-variant-numeric:tabular-nums}
.mc .spk{width:62px;height:34px;align-self:flex-end}
.mcf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.mcf .sub{font-size:12px}.mcf b{color:var(--ink)}
.bpl{height:8px;border-radius:999px;background:#F3E3F7;overflow:hidden;min-width:60px}.bpl>div{height:100%;border-radius:999px}
.md.lg .mi.tx3{font-size:17px}
.chb{display:grid;gap:4px}.chh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}.deal{font-size:12.5px;color:#6b4a73}.deal em{font-style:normal;font-weight:800;color:var(--plum)}
.tabrow{margin-bottom:12px;overflow-x:auto}
.stk2{display:grid;gap:8px;margin-top:12px}
.fc{border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}.fc.hl{background:linear-gradient(100deg,#F9EDF9,#F1DCF5);box-shadow:inset 0 0 0 1.5px #D9A6DF}
.fch{display:flex;align-items:center;gap:12px;width:100%;padding:7px 14px 7px 8px;border-radius:24px}.fch b{font-size:14px}.fch .sp{flex:1}.fsum{font:800 13.5px 'Onest',sans-serif;color:var(--plum)}
.fch .cv{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--plum);transition:transform .3s}.fch .cv svg{width:11px;height:11px;stroke-width:2.6}.fc.on .cv{transform:rotate(180deg)}
.fcb{padding:4px 14px 14px}.pils{display:flex;gap:8px;flex-wrap:wrap}.pill.big{font-size:13px;padding:5px 14px}
.pager{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
.pg{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:#fff;color:var(--plum);font:700 13px 'Onest',sans-serif;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.pg.on{background:var(--grad);color:#fff;text-shadow:0 1px 1px #00000026;box-shadow:0 5px 12px #66146644,inset 0 0 0 2px #ffffff40,0 0 0 4px #AE40AE38}
.pg.arr{padding:0;background:var(--soft);box-shadow:none}.pg.arr svg{width:14px;height:14px;stroke-width:2.6}.pg.arr svg.l{transform:rotate(90deg)}.pg.arr svg.r{transform:rotate(-90deg)}.pgn{margin-left:10px;font-size:12px;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}@media (max-width:1000px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}.stk3{display:grid;gap:12px}
.dstrip{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:thin}
.dp{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;width:52px;padding:8px 0;border-radius:26px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.dp b{font:800 16px 'Onest',sans-serif}.dp small{font-size:11px;color:var(--mut)}.dp i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--c,#C9A8D1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#C9A8D1) 22%,transparent)}
.dp.done{--c:#12A144}.dp.over{--c:#D92D2D;background:#FFF7F8}.dp.future{--c:#C9A8D1}.dp.weekend{--c:#C9A8D1;background:#F6F1F8;opacity:.7}.dp.cur{background:var(--grad);color:#fff;box-shadow:0 8px 16px -6px #66146699,0 0 0 4px #AE40AE26}.dp.cur small{color:#ffffffcc}.dp.cur i{--c:#fff}
.dleg{display:flex;gap:6px 16px;flex-wrap:wrap;list-style:none;margin:0 0 4px;padding:0;font:600 12px 'Onest',sans-serif;color:#7a5a85}.dleg li{display:flex;align-items:center;gap:7px}.dleg i{width:9px;height:9px;border-radius:50%;background:var(--c)}.dleg .done{--c:#12A144}.dleg .over{--c:#D92D2D}.dleg .future,.dleg .weekend{--c:#C9A8D1}
.mnav{display:flex;align-items:center;gap:10px}.mnav b{font:800 14px 'Onest',sans-serif;min-width:116px;text-align:center}
.tiles1{display:grid;gap:8px}.tiles1 .tile b{font-size:16px}.fill{display:flex;align-items:center;gap:14px}.md.lg{--s:68px;--r:6px}.fl2{display:grid;gap:3px;font-size:12px;color:#6b4a73}.fl2 b{font-size:13.5px;color:var(--ink)}.fl2 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

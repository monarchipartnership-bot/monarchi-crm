<title>Макет клиентской страницы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap">
<style>
/* Layout concept: a full-width client report. Tabs: all months (comparison charts) and each month. A month: overview charts, then one row per week with the numbers table on the left and the texts and creatives on the right, then the month summary in the same layout. Two looks (toggle): A light business, B Monarchi plum. */
:root {
  --bg: #F4F6F8; --card: #FFFFFF; --ink: #14171C; --muted: #66707C; --line: #E1E5EA; --accent: #0D7C86; --accent-soft: #DCF0F2; --accent-ink: #07545B;
  --good: #1B7A47; --good-bg: #E1F3E8; --bad: #B23A3A; --bad-bg: #FBE7E7; --bar2: #9EC8CD; --font: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif: 'Fraunces', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-variant="b"]) { --bg: #101317; --card: #181C22; --ink: #EEF1F4; --muted: #98A2AE; --line: #2A313A; --accent: #4FC3CE; --accent-soft: #14343A; --accent-ink: #A8E6EC; --good: #6FD3A0; --good-bg: #153027; --bad: #F08A8A; --bad-bg: #3A1A1A; --bar2: #2F6A71; color-scheme: dark; }
}
:root[data-theme="dark"]:not([data-variant="b"]) { --bg: #101317; --card: #181C22; --ink: #EEF1F4; --muted: #98A2AE; --line: #2A313A; --accent: #4FC3CE; --accent-soft: #14343A; --accent-ink: #A8E6EC; --good: #6FD3A0; --good-bg: #153027; --bad: #F08A8A; --bad-bg: #3A1A1A; --bar2: #2F6A71; color-scheme: dark; }
:root[data-variant="b"] { --bg: #1A0F24; --card: #25162F; --ink: #F5ECF9; --muted: #B7A3C4; --line: #3A2748; --accent: #D07BE6; --accent-soft: #3C2250; --accent-ink: #EFC4FA; --good: #7FDCA8; --good-bg: #1D3A2D; --bad: #F59A9A; --bad-bg: #432127; --bar2: #6E3F86; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.55; padding-block: 18px 56px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.wrap { width: 100%; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
p { margin: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.client b { font-size: 20px; display: block; line-height: 1.2; font-weight: 600; }
.client span { font-size: 13px; color: var(--muted); }
.right { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: flex-end; }
.logo { color: var(--ink); line-height: 0; }
.logo svg { height: 34px; width: auto; display: block; }
.variant { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; font-size: 12.5px; }
.variant button { font: inherit; padding: 5px 11px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
.variant button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { font: inherit; padding: 9px 16px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.stamp { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.stamp b { color: var(--ink); font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--muted); display: block; }
.kpi b { font-size: 24px; font-weight: 600; letter-spacing: -.01em; display: block; margin: 2px 0; font-variant-numeric: tabular-nums; }
.delta { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; display: inline-block; }
.delta.up { color: var(--good); background: var(--good-bg); } .delta.down { color: var(--bad); background: var(--bad-bg); }
.vs { font-size: 12px; color: var(--muted); margin-left: 4px; }
.charts3 { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
.charts6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card h3 { font-size: 14px; margin-bottom: 8px; }
.card .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hb { display: flex; flex-direction: column; gap: 9px; }
.hb div { display: grid; grid-template-columns: 120px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.hb .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; display: block; }
.hb .fill { height: 100%; background: var(--accent); border-radius: 5px; display: block; }
.hb em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.donut { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.dl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.dl i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }
.weekrow { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.weekrow > header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.weekrow > header h2 { font-size: 16px; }
.weekrow > header span { color: var(--muted); font-size: 13px; }
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.split .l { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.split .r { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 10px; border: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--card); min-width: 130px; max-width: 130px; z-index: 2; }
th:nth-child(2), td:nth-child(2) { position: sticky; left: 130px; z-index: 1; box-shadow: 4px 0 6px -4px rgba(0, 0, 0, .25); }
th { min-width: 96px; }
thead th { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; text-align: center; white-space: normal; }
td.gen { background: var(--accent-soft); }
td.best { background: var(--good-bg); color: var(--good); font-weight: 600; }
td.worst { background: var(--bad-bg); color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); }
.gtoggle { font: inherit; font-size: 12.5px; margin-left: 8px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--accent-ink); cursor: pointer; }
.split.wide { grid-template-columns: minmax(0, 1fr); }
.split.wide .r { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.split.wide .r .crea, .split.wide .r .sub { grid-column: 1 / -1; }
.mk { display: block; font-size: 11px; font-weight: 700; line-height: 1.2; margin-top: 1px; }
.mk.good { color: var(--good); } .mk.bad { color: var(--bad); } .mk.neutral, .mk.none { color: var(--muted); font-weight: 500; }
td.best .mk.good, td.worst .mk.bad { color: inherit; }
.t { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
.t h4 { margin: 0 0 5px; font-size: 13px; color: var(--accent-ink); font-weight: 600; }
.t p { font-size: 13.5px; }
.crea { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.crea figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.crea .img { aspect-ratio: 4 / 5; display: grid; place-items: center; font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); padding: 10px; text-align: center; }
.crea figcaption { padding: 6px 9px; font-size: 12.5px; border-top: 1px solid var(--line); }
.crea .cr { all: unset; display: block; cursor: zoom-in; width: 100%; }
.crea .cr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.crea img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.crea .zoom { font-size: 11.5px; color: var(--muted); display: block; margin-top: 1px; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 14, .84); display: grid; place-items: center; padding: 24px; }
.lb figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 100%; }
.lb img { height: min(84vh, 900px); width: auto; aspect-ratio: 4 / 5; max-width: 92vw; object-fit: contain; border-radius: 12px; display: block; background: #fff; }
.lb figcaption { color: #fff; font-size: 14px; text-align: center; }
.lb-x { position: absolute; top: 16px; right: 20px; font: inherit; font-size: 26px; line-height: 1; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .4); background: rgba(0, 0, 0, .3); color: #fff; cursor: pointer; }
.sub { font-size: 13px; font-weight: 600; color: var(--accent-ink); margin: 0; }
.note { font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
.mtable td:first-child, .mtable th:first-child { min-width: 110px; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } .charts3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .charts3 > :first-child { grid-column: 1 / -1; } .charts6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .charts3, .charts6 { grid-template-columns: minmax(0, 1fr); } .hb div { grid-template-columns: 100px 1fr 46px; } }
</style>

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="' + A.bg + '"/><circle cx="560" cy="400" r="300" fill="' + A.shape + '" opacity="0.55"/><path d="M300 1000 C300 770 410 650 520 650 C630 650 740 770 740 1000Z" fill="' + A.cloth + '"/><circle cx="520" cy="480" r="112" fill="' + A.skin + '"/><path d="M395 470 C395 320 470 285 535 285 C640 285 695 370 655 540 C645 430 600 390 535 390 C465 390 425 425 395 470Z" fill="' + A.hair + '"/><text x="50" y="130" font-family="Georgia, serif" font-size="52" font-weight="700" fill="' + A.ink + '">' + A.title + '</text><text x="50" y="190" font-family="Arial, sans-serif" font-size="32" fill="' + A.ink + '">' + A.sub + '</text><rect x="50" y="860" width="270" height="76" rx="38" fill="' + A.ink + '"/><text x="185" y="909" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="' + A.bg + '">SHOP NOW</text><text x="50" y="975" font-family="Arial, sans-serif" font-size="24" fill="' + A.ink + '">mellowdiamond.com</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function crea(list) {
  return '<div class="crea">' + list.map(function (c) {
    return '<figure><button class="cr" type="button" data-a="' + c.a + '" data-t="' + c.t.replace(/"/g, '&quot;') + '" aria-label="Open creative: ' + c.t.replace(/"/g, '&quot;') + '"><img src="' + art(c.a) + '" alt="Ad creative: ' + c.t.replace(/"/g, '&quot;') + '"><figcaption>' + c.t + '<span class="zoom">Click to enlarge</span></figcaption></button></figure>';
  }).join('') + '</div>';
}
var lastOpener = null;
function openLb(btn) { lastOpener = btn; document.getElementById('lbimg').src = art(Number(btn.getAttribute('data-a'))); document.getElementById('lbimg').alt = btn.getAttribute('data-t'); document.getElementById('lbcap').textContent = btn.getAttribute('data-t'); document.getElementById('lb').hidden = false; document.getElementById('lbx').focus(); }
function closeLb() { document.getElementById('lb').hidden = true; if (lastOpener) lastOpener.focus(); }
document.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('.cr') : null; if (b) { openLb(b); return; } if (e.target.id === 'lb' || e.target.id === 'lbx') closeLb(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('lb').hidden) closeLb(); });
function tx(t, p) { return '<div class="t"><h4>' + t + '</h4><p>' + p + '</p></div>'; }

function weekRow(w, i) {
  var prev = i === 0 ? PREV_W1 : { label: 'Week ' + WEEKS[i - 1].n + ' (' + WEEKS[i - 1].from + ' – ' + WEEKS[i - 1].to + ')', gen: WEEKS[i - 1].gen, groups: WEEKS[i - 1].groups };
  return '<section class="weekrow"><header><h2>Week ' + w.n + '</h2><span>' + w.from + ' – ' + w.to + ' · approved</span></header><div class="split' + (Object.keys(w.groups).length > 5 ? ' wide' : '') + '"><div class="l">' + metricTable(w.gen, w.groups, prev, 'w' + w.n) + '</div><div class="r">' +
    tx('What was done', w.done) + tx('Conclusion', w.concl) + tx('Plans for the next period', w.plans) + '<p class="sub">Most effective creatives</p>' + crea(w.crea) + '</div></div></section>';
}

function combo(o) {
  var W = o.w || 640, H = o.h || 250, pl = 46, pr = o.line ? 44 : 14, pt = 16, pb = 32, n = o.labels.length, cw = (W - pl - pr) / n;
  var y = function (v) { return pt + (H - pt - pb) * (1 - v / o.maxBar); }, yr = function (v) { return pt + (H - pt - pb) * (1 - v / o.maxLine); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + o.title + '"><title>' + o.title + '</title>';
  o.ticks.forEach(function (t) { s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + o.fmtBar(t) + '</text>'; });
  var k = o.bars.length, bw = cw * 0.7 / k, pts = [];
  o.labels.forEach(function (lab, i) {
    var x = pl + i * cw;
    o.bars.forEach(function (b, j) { var v = b.vals[i], part = o.partial && o.partial[i]; s += '<rect x="' + (x + cw * 0.15 + j * (bw + 3)) + '" y="' + y(v) + '" width="' + bw + '" height="' + (H - pb - y(v)) + '" rx="3" fill="' + b.color + '"' + (part ? ' fill-opacity="0.45"' : '') + '/>'; });
    s += '<text x="' + (x + cw / 2) + '" y="' + (H - 11) + '" text-anchor="middle" font-size="11.5" fill="var(--muted)">' + lab + '</text>';
    if (o.line) pts.push([x + cw / 2, yr(o.line.vals[i]), o.line.vals[i]]);
  });
  if (o.line) {
    s += '<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') + '"/>';
    pts.forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="' + p[0] + '" y="' + (p[1] - 9) + '" text-anchor="middle" font-size="11" fill="var(--ink)">' + o.line.fmt(p[2]) + '</text>'; });
    o.lineTicks.forEach(function (t) { s += '<text x="' + (W - pr + 6) + '" y="' + (yr(t) + 4) + '" font-size="11" fill="var(--muted)">' + o.line.fmt(t) + '</text>'; });
  }
  s += '</svg><div class="legend">' + o.bars.map(function (b) { return '<span><i style="background:' + b.color + '"></i>' + b.name + '</span>'; }).join('') + (o.line ? '<span><i style="background:var(--ink)"></i>' + o.line.name + ' (right axis)</span>' : '') + '</div>';
  return s;
}
function topIds(n) { return ORDER.filter(function (id) { return MONTH.groups[id] && MONTH.groups[id].spend > 100; }).sort(function (x, y) { return MONTH.groups[y].spend - MONTH.groups[x].spend; }).slice(0, n); }
function groupsRoas() {
  var rows = topIds(8).map(function (id) { var g = MONTH.groups[id]; return [NAMES[id].split(' (')[0], g.revenue / g.spend * 100]; }).sort(function (x, y) { return y[1] - x[1]; });
  var mx = Math.max.apply(null, rows.map(function (r) { return r[1]; }));
  return '<div class="hb">' + rows.map(function (r) { return '<div><span>' + r[0] + '</span><span class="track"><span class="fill" style="width:' + Math.round(r[1] / mx * 100) + '%"></span></span><em>' + Math.round(r[1]) + '%</em></div>'; }).join('') + '</div>' + (ORDER.length > 8 ? '<p class="hint" style="margin-top:8px">Top 8 groups by spend; the rest are in the table.</p>' : '');
}
function donut() {
  var all = ORDER.filter(function (id) { return MONTH.groups[id] && MONTH.groups[id].spend > 100; }), tot = all.reduce(function (a, id) { return a + MONTH.groups[id].spend; }, 0);
  var top = topIds(5), restSum = all.filter(function (id) { return top.indexOf(id) < 0; }).reduce(function (a, id) { return a + MONTH.groups[id].spend; }, 0);
  var parts = top.map(function (id) { return [NAMES[id].split(' (')[0], MONTH.groups[id].spend]; }); if (restSum > 0) parts.push(['Other', restSum]);
  var cols = ['var(--accent)', 'var(--bar2)', 'var(--ink)', 'var(--muted)', 'var(--good)', 'var(--line)'], off = 0, R = 52, C = 2 * Math.PI * R;
  var s = '<svg viewBox="0 0 140 140" width="130" height="130" role="img" aria-label="Spend share by campaign group"><title>Spend share by campaign group</title>';
  parts.forEach(function (pt, i) { var part = pt[1] / tot * C; s += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cols[i % cols.length] + '" stroke-width="22" stroke-dasharray="' + part + ' ' + (C - part) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>'; off += part; });
  return '<div class="donut">' + s + '</svg><div class="dl">' + parts.map(function (pt, i) { return '<span><i style="background:' + cols[i % cols.length] + '"></i>' + pt[0] + ' · ' + Math.round(pt[1] / tot * 100) + '%</span>'; }).join('') + '</div></div>';
}
function dl(cur, prev, lowerIsBetter) { var p = (cur - prev) / prev * 100, good = lowerIsBetter ? p < 0 : p > 0; return '<span class="delta ' + (good ? 'up' : 'down') + '">' + (p > 0 ? '+' : '') + p.toFixed(1) + '%</span>'; }
var AUG = HIST[3];

function september() {
  var d = derive(MONTH.gen), a = { roas: AUG.revenue / AUG.spend * 100, cpp: AUG.spend / AUG.sales };
  var kp = [['Spent', f(d.spend, 'money'), dl(d.spend, AUG.spend, false)], ['Revenue', f(d.revenue, 'money'), dl(d.revenue, AUG.revenue, false)], ['ROAS', f(d.roas, 'pctint'), dl(d.roas, a.roas, false)], ['Purchases', f(d.sales, 'int'), dl(d.sales, AUG.sales, false)], ['Cost per purchase', f(d.cpp, 'money'), dl(d.cpp, a.cpp, true)], ['Reach', f(d.reach, 'int'), '']];
  var h = '<div class="stamp"><span>Data as of <b>01.10.2026</b></span><span>Weeks approved: <b>5 of 5</b></span><span>Month report: <b>final</b></span></div>';
  h += '<div class="kpis">' + kp.map(function (k) { return '<div class="kpi"><span class="l">' + k[0] + '</span><b>' + k[1] + '</b>' + k[2] + (k[2] ? '<span class="vs">vs August</span>' : '') + '</div>'; }).join('') + '</div>';
  h += '<div class="charts3"><div class="card"><h3>Weeks of September: spend, revenue and ROAS</h3>' + combo({ title: 'Weekly spend, revenue and ROAS', labels: WEEKS.map(function (w) { return 'W' + w.n; }), bars: [{ name: 'Spend', vals: WEEKS.map(function (w) { return w.gen.spend; }), color: 'var(--bar2)' }, { name: 'Revenue', vals: WEEKS.map(function (w) { return w.gen.revenue; }), color: 'var(--accent)' }], maxBar: 16000, ticks: [0, 4000, 8000, 12000, 16000], fmtBar: function (v) { return '$' + v / 1000 + 'k'; }, line: { name: 'ROAS', vals: WEEKS.map(function (w) { return w.gen.revenue / w.gen.spend * 100; }), fmt: function (v) { return Math.round(v) + '%'; } }, maxLine: 1000, lineTicks: [0, 500, 1000] }) + '</div>' +
    '<div class="card"><h3>Spend by campaign group</h3>' + donut() + '</div><div class="card"><h3>ROAS by campaign group</h3>' + groupsRoas() + '</div></div>';
  h += WEEKS.map(function (w, i) { return weekRow(w, i); }).join('');
  h += '<section class="weekrow"><header><h2>September summary</h2><span>01.09 – 30.09 · final</span></header><div class="split' + (Object.keys(MONTH.groups).length > 5 ? ' wide' : '') + '"><div class="l">' + metricTable(MONTH.gen, MONTH.groups, PREV_AUG, 'm') +
    '<p class="hint">Reach of the month (' + f(MONTH.gen.reach, 'int') + ') is counted for the whole month, not summed from the weeks (' + f(WEEKS.reduce(function (a, w) { return a + w.gen.reach; }, 0), 'int') + '): the same person is seen in several weeks.</p></div><div class="r">' +
    tx('What was done', 'Throughout the month we scaled the Catalog RTS campaign, tested the Labor Day offer, launched the RTS Special Offer and prepared Make To Order creatives.') +
    tx('Conclusion', 'In September the account maintained a strong overall level of efficiency despite active scaling across several directions. Total ad spend increased from about $6.3K to $6.7K, while the account generated 54 purchases compared to 52 in August. Overall CPA increased from $117 to $129, while ROAS decreased from 655% to 530%.') +
    tx('Plans for the next period', 'Continue working with Hybrid Wigs, test RTS Special Offers and formats, make Make To Order a separate focus area and avoid aggressive scaling at the initial stage.') +
    tx('Conclusions about products/areas which were in ads', 'Example text. Kinky Bang showed very strong efficiency on a lower budget. Catalog RTS carried the volume, Hybrid Wig needs more careful CPA control.') +
    tx('Why we see such results', 'Example text. Efficiency decreased mainly because of scaling the Catalog RTS campaign and reallocating budget towards directions with growth potential.') +
    tx('What worked good', 'Example text. Kinky Bang, promotional offers, catalog creatives with discounts.') +
    tx('What worked worse', 'Example text. Website Traffic produced many low-cost clicks but no direct sales.') +
    '<p class="sub">Most effective creatives</p>' + crea([{ t: 'Catalog', a: 1 }, { t: 'ROAS 15.74', a: 3 }, { t: 'banner + catalog RTS -15% labour day sale', a: 0 }, { t: 'Hybrid Wig RTS -15%', a: 2 }]) + '</div></div></section>';
  h += '<p class="note">Макет на цифрах сентября mellowdiamond. Недели 1, 2 и 5 и итог взяты из вашей таблицы, неделя 3, часть недели 4 и тексты «Example text» ориентировочные. Картинки креативов в макете нарисованы для примера, в боевой версии подтягиваются из объявлений Meta: 3 на неделю, 4 на месяц.</p>';
  return h;
}

function allMonths() {
  var labels = HIST.map(function (m) { return m.m; }), part = HIST.map(function (m) { return !!m.partial; });
  var last = HIST[4], prev = HIST[3];
  var small = function (title, vals, fmt, color, lowerIsBetter) {
    var cur = vals[4], pv = vals[3];
    return '<div class="card"><h3>' + title + '</h3><div class="big">' + fmt(cur) + ' ' + dl(cur, pv, !!lowerIsBetter) + '<span class="vs">Sep vs Aug</span></div>' +
      combo({ title: title, w: 420, h: 170, labels: labels, partial: part, bars: [{ name: title, vals: vals, color: color }], maxBar: Math.max.apply(null, vals) * 1.15, ticks: [0, Math.max.apply(null, vals) * 1.15 / 2, Math.max.apply(null, vals) * 1.15], fmtBar: function (v) { return String(fmt(v)).replace(/\.\d+/, ''); } }).replace(/<div class="legend">.*<\/div>$/, '') + '</div>';
  };
  var roas = HIST.map(function (m) { return m.revenue / m.spend * 100; }), cpa = HIST.map(function (m) { return m.spend / m.sales; }), aov = HIST.map(function (m) { return m.revenue / m.sales; });
  var h = '<div class="stamp"><span>Whole period: <b>May – October 2026</b></span><span>New months are added here automatically once a month report is approved</span><span>October: <b>month to date</b> (lighter bars)</span></div>';
  h += '<div class="card"><h3>Spend, revenue and ROAS by month</h3>' + combo({ title: 'Spend, revenue and ROAS by month', w: 1100, h: 270, labels: labels, partial: part, bars: [{ name: 'Spend', vals: HIST.map(function (m) { return m.spend; }), color: 'var(--bar2)' }, { name: 'Revenue', vals: HIST.map(function (m) { return m.revenue; }), color: 'var(--accent)' }], maxBar: 45000, ticks: [0, 15000, 30000, 45000], fmtBar: function (v) { return '$' + v / 1000 + 'k'; }, line: { name: 'ROAS', vals: roas, fmt: function (v) { return Math.round(v) + '%'; } }, maxLine: 800, lineTicks: [0, 400, 800] }) + '</div>';
  h += '<div class="charts6">' +
    small('Purchases', HIST.map(function (m) { return m.sales; }), function (v) { return Math.round(v); }, 'var(--accent)') +
    small('Cost per purchase', cpa, function (v) { return '$' + Math.round(v); }, 'var(--bar2)', true) +
    small('Average order value', aov, function (v) { return '$' + Math.round(v); }, 'var(--accent)') +
    small('CTR', HIST.map(function (m) { return m.ctr; }), function (v) { return v.toFixed(1) + '%'; }, 'var(--bar2)') +
    small('CPM', HIST.map(function (m) { return m.cpm; }), function (v) { return '$' + Math.round(v); }, 'var(--accent)', true) +
    small('ROAS', roas, function (v) { return Math.round(v) + '%'; }, 'var(--bar2)') + '</div>';
  h += '<div class="card"><h3>Month by month</h3><div class="scroll"><table class="mtable"><thead><tr><th></th>' + HIST.map(function (m) { return '<th>' + m.m + (m.partial ? ' (to date)' : '') + '</th>'; }).join('') + '</tr></thead><tbody>' +
    [['Spent', function (m) { return f(m.spend, 'money'); }], ['Revenue', function (m) { return f(m.revenue, 'money'); }], ['ROAS (Meta)', function (m) { return f(m.revenue / m.spend * 100, 'pctint'); }], ['Number of sales', function (m) { return f(m.sales, 'int'); }], ['CPP', function (m) { return f(m.spend / m.sales, 'money'); }], ['AOV', function (m) { return f(m.revenue / m.sales, 'money'); }], ['CTR', function (m) { return f(m.ctr, 'pct'); }], ['CPM', function (m) { return f(m.cpm, 'money2'); }]].map(function (r) { return '<tr><td>' + r[0] + '</td>' + HIST.map(function (m) { return '<td>' + r[1](m) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
  h += '<p class="note">Цифры мая, июня, июля и октября в этом макете демонстрационные. В боевой версии здесь все утверждённые месяцы работы с клиентом, новые добавляются сами.</p>';
  return h;
}

var cur = 4, ALL = -1;
function render() {
  var tabs = [['All months', ALL]].concat(MONTHS.map(function (m, i) { return [m, i]; }));
  document.getElementById('tabs').innerHTML = tabs.map(function (t) { return '<button class="tab" role="tab" aria-selected="' + (t[1] === cur) + '" data-i="' + t[1] + '">' + t[0] + '</button>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { cur = Number(b.getAttribute('data-i')); render(); }); });
  var v = document.getElementById('view');
  v.innerHTML = cur === ALL ? allMonths() : cur === 4 ? september() : cur === 5 ? '<div class="empty">October 2026: the month is in progress. Weeks appear here as soon as the manager approves them, and the month totals update with each new week.</div>' : '<div class="empty">' + MONTHS[cur] + ' 2026: in the live version every approved month opens here exactly like September. The mockup is filled only for September.</div>';
}
function setVariant(b) { if (b) document.documentElement.setAttribute('data-variant', 'b'); else document.documentElement.removeAttribute('data-variant'); document.getElementById('vA').setAttribute('aria-pressed', String(!b)); document.getElementById('vB').setAttribute('aria-pressed', String(b)); }
document.getElementById('vA').addEventListener('click', function () { setVariant(false); });
function setGroups(on) { setMany(on); document.getElementById('gA').setAttribute('aria-pressed', String(!on)); document.getElementById('gB').setAttribute('aria-pressed', String(on)); render(); }
document.getElementById('gA').addEventListener('click', function () { setGroups(false); });
document.getElementById('gB').addEventListener('click', function () { setGroups(true); });
document.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('.gtoggle') : null; if (b) { var t = b.getAttribute('data-t'); EXP[t] = !EXP[t]; render(); } });
document.getElementById('vB').addEventListener('click', function () { setVariant(true); });
render();
</script>
